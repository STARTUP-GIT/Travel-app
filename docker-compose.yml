services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atlaswanders-backend:${IMAGE_TAG:-latest}
    container_name: atlaswanders-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      # Mandatory durable production runtime environment file on the VM.
      # Maintained locally on the VM (permissions 0600, owned by github-runner).
      # Used directly for production container execution, migrations, and manual CLI rollback.
      - /etc/atlaswanders/backend.env
    environment:
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      # Uses node (always present in image) rather than curl (not installed in slim image).
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - atlaswanders_default

# The atlaswanders_default network is managed by the existing PostgreSQL 18.7
# container (atlaswanders-postgres18). It is declared external so Docker Compose
# joins it without creating or destroying it. If the network does not exist,
# 'docker compose up' will fail with a clear error rather than creating an
# isolated network that cannot reach the database.
#
# DO NOT add a 'db' service here. DO NOT add a postgres volume here.
# The existing database container and its data are managed independently.
networks:
  atlaswanders_default:
    external: true
