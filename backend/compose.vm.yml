# ==============================================================================
# AtlasWanders Production Compose Specification
# Host: AtlasWanders VM (atlaswanders-virtual-machine / 192.168.122.225)
#
# Canonical deployment specification for the AtlasWanders backend service.
# External infrastructure dependencies:
#   - PostgreSQL: container 'atlaswanders-postgres18' (external, unmanaged, untouched)
# Runs on the external Docker network 'atlaswanders_default'.
# ==============================================================================

name: atlaswanders

services:
  backend:
    image: atlaswanders-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlaswanders-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ${SECRETS_FILE:-/etc/atlaswanders/backend.env}
    environment:
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - atlaswanders_default

networks:
  atlaswanders_default:
    external: true
