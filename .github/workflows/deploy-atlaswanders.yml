name: Deploy Atlas Wanders Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-atlaswanders.yml'
  workflow_dispatch:

# Enforce minimal token permissions — read-only access to repository contents.
permissions:
  contents: read

# Concurrency group serialized per environment.
# Job-level timeout-minutes and script-level flock prevent indefinite queuing.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: CI validation on GitHub-hosted runner.
  # Verifies the code compiles cleanly, Prisma Client generates, and the
  # Docker image builds on Linux before the deploy job ever runs on the VM.
  # If Docker build fails here, Job 2 will never execute.
  # ---------------------------------------------------------------------------
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run db:generate

      - name: TypeScript Compile & Build
        working-directory: backend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (validation — not pushed)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atlaswanders-backend:ci-${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Job 2: Deploy on the self-hosted runner inside the AtlasWanders VM.
  #
  # The runner process runs directly on the VM — polling GitHub outbound (HTTPS).
  # Timeout protection: 15 minutes prevents jobs from waiting indefinitely if
  # the runner ever becomes unavailable or disk fills up.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AtlasWanders VM
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, atlaswanders]
    if: github.ref == 'refs/heads/main'
    environment: Atlaswanders-backend-production
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pre-flight guard: Check runner system disk space & clean build cache before build
      - name: Runner Pre-Flight & Disk Space Verification
        run: |
          echo "============================================================"
          echo " Runner Pre-Flight & Disk Space Verification"
          echo " Target Host: AtlasWanders VM (192.168.122.225)"
          echo "============================================================"
          echo "Current disk utilization on /:"
          df -h /

          echo "Proactively pruning stale Docker build cache (>24h)..."
          docker builder prune -f --filter "until=24h" >/dev/null 2>&1 || true

          AVAIL_MB=$(df -BM / | awk 'NR==2 {gsub("M","",$4); print $4}')
          echo "Available disk space after prune: ${AVAIL_MB} MB"
          if [ "${AVAIL_MB}" -lt 500 ]; then
            echo "::warning::Available space on / is below 500MB (${AVAIL_MB} MB). Running aggressive prune..."
            docker builder prune -a -f --keep-storage 500MB >/dev/null 2>&1 || true
          fi

      # Execute canonical deployment pipeline via backend/scripts/deploy.sh
      # Includes:
      #   1. Exclusive deployment flock (/tmp/atlaswanders-deploy.lock)
      #   2. Pre-flight checks (Docker daemon, network, postgres container, /etc/atlaswanders/backend.env)
      #   3. Image build tagged with Git commit SHA
      #   4. Pre-migration database backup (pg_dump) via migrate.sh
      #   5. Prisma migration execution with status verification
      #   6. Container swap and HTTP health check polling (up to 60s)
      #   7. Automated rollback to previous image on failure
      - name: Execute Safe Production Deployment
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          chmod +x backend/scripts/deploy.sh
          chmod +x backend/scripts/migrate.sh
          chmod +x backend/scripts/rollback.sh
          bash backend/scripts/deploy.sh

      # Post-deployment fleet diagnostics
      - name: Post-Deployment Fleet Diagnostics
        if: always()
        run: |
          echo "============================================================"
          echo " Post-Deployment Fleet Status Diagnostics"
          echo "============================================================"
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      # Always verify PostgreSQL container is unaffected
      - name: Confirm PostgreSQL container is unaffected
        if: always()
        run: |
          PG_STATUS=$(docker inspect --format='{{.State.Status}}' atlaswanders-postgres18 2>/dev/null || echo "not_found")
          if [ "${PG_STATUS}" = "running" ]; then
            echo "✓ atlaswanders-postgres18 is unaffected: ${PG_STATUS}"
          else
            echo "::warning::atlaswanders-postgres18 status is '${PG_STATUS}'. Investigate independently."
          fi

      # Surfaces container logs on step failure
      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== Last 50 lines of atlaswanders-backend logs ==="
          docker logs --tail=50 atlaswanders-backend 2>/dev/null || echo "(No logs available)"
